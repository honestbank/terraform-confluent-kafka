---
name: repository-secrets-check

# Public-repo variant of repository-secrets-check.yaml.
# Public repos cannot call reusable workflows from the private honestbank/workflows repo,
# so we inline the gitleaks scan here. The workflow `name:` plus the job id `shared-gitleaks`
# together produce the GitHub status-check context `repository-secrets-check / shared-gitleaks`,
# matching CONST_BRANCH_PROTECTION_CHECK_NAME_GITLEAKS in honestbank/terraform-code-infrastructure.

permissions:
  contents: read
  pull-requests: write

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  shared-gitleaks:
    name: "repository-secrets-check / shared-gitleaks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Dependabot-triggered runs read from Dependabot's own secret store and
          # cannot see ENGINEERING_GITHUB_PERSONAL_ACCESS_TOKEN, so it resolves to
          # an empty string and checkout fails with "Input required and not
          # supplied: token". Fall back to the job's own GITHUB_TOKEN, which is
          # sufficient for checking out the repository being scanned.
          token: ${{ secrets.ENGINEERING_GITHUB_PERSONAL_ACCESS_TOKEN || github.token }}

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
