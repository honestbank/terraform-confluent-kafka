name: "Semantic Pull Request"
permissions: read-all

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: "Semantic Pull Request"
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        name: Semantic Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
