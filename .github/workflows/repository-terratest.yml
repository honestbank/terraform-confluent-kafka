name: repository-terratest
permissions:
  contents: write
  pull-requests: write
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  TERRATEST_CONFLUENT_CLOUD_SEED_KEY: ${{ secrets.TERRATEST_CONFLUENT_CLOUD_SEED_KEY }}
  TERRATEST_CONFLUENT_CLOUD_SEED_SECRET: ${{ secrets.TERRATEST_CONFLUENT_CLOUD_SEED_SECRET }}
  TERRATEST_CONFLUENT_CLOUD_EMAIL: ${{ secrets.TERRATEST_CONFLUENT_CLOUD_EMAIL }}
  TERRATEST_CONFLUENT_CLOUD_PASSWORD: ${{ secrets.TERRATEST_CONFLUENT_CLOUD_PASSWORD }}
  TERRATEST_GOOGLE_CREDENTIALS_STORAGE: ${{ secrets.TERRATEST_GOOGLE_CREDENTIALS_STORAGE }}
  TERRATEST_GOOGLE_PROJECT_STORAGE: ${{ secrets.TERRATEST_GOOGLE_PROJECT_STORAGE }}

jobs:
  repository-terratest:
    name: repository-terratest
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Go (1.23)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26
        id: go

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.0"

      - name: Install Confluent CLI
        run: |
          set -euo pipefail
          V=3.65.0
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64|arm64) ARCH=arm64 ;; esac
          BASE="https://s3-us-west-2.amazonaws.com/confluent.cloud/confluent-cli/archives/$V"
          TARBALL="confluent_${V}_${OS}_${ARCH}.tar.gz"
          curl -sSfL --http1.1 -o "/tmp/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL --http1.1 -o /tmp/confluent_checksums.txt "$BASE/confluent_${V}_checksums.txt"
          WANT=$(awk -v f="$TARBALL" '$2==f {print $1}' /tmp/confluent_checksums.txt)
          test -n "$WANT"
          printf '%s  %s\n' "$WANT" "/tmp/$TARBALL" | sha256sum -c -
          tar -xzf "/tmp/$TARBALL" -C /tmp
          install -D /tmp/confluent/confluent ./bin/confluent
          echo "$PWD/bin" >> $GITHUB_PATH
          ./bin/confluent --version

      - name: Run terratest
        run: |
          cd test
          go mod tidy
          go mod download
          go test -v -timeout 60m

      - name: Release
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.2
            @semantic-release/changelog@6.0.1
